name: Deploy Juvantia Auth

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Создаем папку и заходим в неё
            mkdir -p /var/www/juvantia/auth
            cd /var/www/juvantia/auth

            # Если проекта нет, клонируем (используем SSH, так как ключ у вас на VPS есть)
            if [ ! -d ".git" ]; then
              echo "Repository not found. Cloning..."
              git clone git@github.com:juvantia/auth.git .
            else
              echo "Updating repository..."
              git pull origin main
            fi

            # Создаем .env.local из секрета GitHub с автоматической заменой для Docker/Prod
            echo "${{ secrets.ENV_LOCAL }}" > .env.local
            sed -i 's/localhost:3567/supertokens:3567/g' .env.local
            sed -i 's/http:\/\/localhost:3001/https:\/\/auth.juvantia.org/g' .env.local

            # Пересобираем и запускаем контейнеры
            docker compose up -d --build auth
            docker image prune -f
          command_timeout: 30m
