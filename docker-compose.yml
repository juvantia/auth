version: '3.8'

services:
  auth:
    build: .
    container_name: auth-service
    restart: always
    env_file:
      - .env.local
    environment:
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
    depends_on:
      - supertokens
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.juvantia.org`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.tls.certresolver=myresolver"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
    networks:
      - juvantia-network

  # SuperTokens Core
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: supertokens
    env_file:
      - .env.local
    environment:
      POSTGRESQL_USER: ${POSTGRESQL_USER:-supertokens_user}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-supertokens_strong_password_123}
      POSTGRESQL_HOST: ${POSTGRESQL_HOST:-postgres-shared}
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE_NAME: ${POSTGRESQL_DATABASE_NAME:-supertokens}
    networks:
      - juvantia-network
    restart: always

networks:
  juvantia-network:
    external: true
