version: '3.8'

services:
  auth:
    image: ghcr.io/juvantia/auth:latest
    container_name: auth-service
    restart: always
    env_file:
      - .env.local
    environment:
      # We tell the app to find SuperTokens core on the shared network
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
    networks:
      - juvantia-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.juvantia.org`)" # Update with your domain
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls.certresolver=myresolver"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"

networks:
  juvantia-network:
    external: true
