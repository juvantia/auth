version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-supertokens_user}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-supertokens_password}
      POSTGRES_DB: ${POSTGRESQL_DATABASE_NAME:-supertokens}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - supertokens-network

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    depends_on:
      - db
    ports:
      - "3567:3567"
    env_file:
      - .env.local
    environment:
      POSTGRESQL_USER: ${POSTGRESQL_USER:-supertokens_user}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-supertokens_password}
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE_NAME: ${POSTGRESQL_DATABASE_NAME:-supertokens}
    networks:
      - supertokens-network
    restart: always

  auth:
    build: .
    depends_on:
      - supertokens
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: always
    networks:
      - supertokens-network

volumes:
  postgres-data:

networks:
  supertokens-network:
    driver: bridge
